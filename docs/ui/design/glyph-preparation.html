    <section>
      <fieldset id="routes"><legend>查看流程</legend></fieldset>
      <fieldset id="states"><legend>选择状态</legend></fieldset>
      <p id="note" aria-live="polite"></p>

</main>
<script>
'use strict';
const panel = document.getElementById('panel');
const routes = [
  ['TXT 目录', [
    ['首次整理', 'chapter', '首次打开这本 TXT，按已扫描的原文字节显示进度。此处的 40% 为示例。', 'chapter'],
    ['中途返回', 'file', '返回开书入口并保存已处理的完整行。书签、最近阅读和原阅读位置保持原值。', 'resume'],
    ['断点续建', 'chapter', '再次打开，从上次成功保存的位置继续。只有完整目录成功写入卡后，才允许进入正文。', 'chapter'],
    ['目录已就绪', 'book', '同版本书籍复用卡上的完整目录。此例字形已就绪，直接恢复正文。', 'toc'],
    ['打开目录', 'toc', '目录一次显示当前章所在页，可立即选章和翻页。', ''],
    ['无章节标题', 'tocEmpty', '全文扫描成功且没有识别到标题，也算完成。开书后从菜单看目录时，可按进度跳转。', ''],
    ['写卡失败', 'error', '停在开书入口，提示检查 TF 卡后重试。部分目录保留作续建。', 'retry']
  ]],
  ['开书 · 0.2.19', [
    ['首次建 EPUB 索引', 'bookCatalog', '大型 EPUB 缺少有效索引时先等待建立完成。此阶段没有提前阅读入口。', 'next'],
    ['准备附近字形', 'bookGlyphs', '示例为当前阅读位置起 4 / 10 页。当前页就绪后最多额外等约 2 秒，也可以点「立即阅读」。', 'end'],
    ['已有字形缓存', 'book', '附近字形准备记录命中，直接进入正文。', ''],
    ['提前结束或到书末', 'book', '时间到、手动提前结束或到达书末，进入正文。', '']
  ]],
  ['换字体 · 0.2.19', [
    ['打开字体', 'fontOpen', '打开选中的字体文件。', 'next'],
    ['排版当前页', 'fontPrep', '用新字体准备当前阅读页。', 'next'],
    ['准备附近字形', 'fontGlyphs', '当前页就绪后优先准备附近字形。「立即阅读」结束等待，回到原来的阅读排版页。', 'end'],
    ['返回阅读排版', 'layout', '字号、墨色和字体继续在阅读排版中设置。从排版页返回可继续阅读。', '']
  ]]
];
let route = location.hash === '#open' ? 1 : 0;
let state = 0;
function buttons(id, labels, active, choose) {
  const group = document.getElementById(id);
  group.querySelectorAll('button').forEach(b => b.remove());
  labels.forEach((label, index) => {
    const button = document.createElement('button');
    button.textContent = label;
    button.setAttribute('aria-pressed', index === active);
    button.onclick = () => { choose(index); draw(); };
    group.append(button);
  });
}
function change(index) { state = index; draw(); }
function draw() {
  const states = routes[route][1];
  const [, image, note, operation] = states[state];
  buttons('routes', routes.map(r => r[0]), route, i => { route = i; state = 0; });
  buttons('states', states.map(s => s[0]), state, i => { state = i; });
  document.getElementById('note').textContent = note;
  document.getElementById('caption').textContent = route === 0 ? '章节目录 · 240 × 416' : '固件桌面渲染 · 240 × 416';
  for (const frame of panel.children) {
    frame.hidden = frame.dataset.frame !== image;
  }
  const group = document.getElementById('actions');
  group.replaceChildren();
  function add(label, next) {
    const button = document.createElement('button');
    button.textContent = label;
    button.onclick = () => change(next);
    group.append(button);
  }
  if (operation === 'chapter') { add('返回选书', 1); add('模拟目录完成', 3); }
  if (operation === 'resume' || operation === 'retry') add('重新打开', 2);
  if (operation === 'toc') add('查看章节目录', 4);
  if (operation === 'next') add('查看下一步', state + 1);
  if (operation === 'end') add('立即阅读', states.length - 1);
}
panel.onclick = event => {
  const bounds = panel.getBoundingClientRect();
  const x = (event.clientX - bounds.left) * panel.width / bounds.width;
  const y = (event.clientY - bounds.top) * panel.height / bounds.height;
  if (x < 80 || x >= 160 || y < 360 || y >= 406) return;
  const op = routes[route][1][state][3];
  if (op === 'end') change(routes[route][1].length - 1);
  if (op === 'chapter') change(1);
  if (op === 'retry') change(1);
};
draw();
</script></html>
