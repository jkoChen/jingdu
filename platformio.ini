[platformio]
default_envs = jingdu
test_dir = tests

[env:jingdu]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
board_upload.flash_size = 8MB
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions.csv
board_upload.maximum_size = 3997696
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DJINGDU_SPLIT_INFLATE=1
  -DFREEINK_BOOK_SMALL=1
  -DFREEINK_FONT_STREAM_LOCA=1
  -DFREEINK_FONT_ENABLE_NATIVE_HINTING=1
  -DFREEINK_FONT_ENABLE_AUTOHINT=0
  -I lib/FreeInkFont/third_party/stb
  -I lib/FreeInkFont/include
monitor_speed = 115200
